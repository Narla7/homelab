services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/narla/radarr/config:/config
      - /home/narla/torrents:/downloads
      - /home/narla/media:/data
    ports:
      - 7878:7878
    restart: unless-stopped
