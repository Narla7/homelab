services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: 1000:1000
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /home/narla/jellyfin/config:/config
      - /home/narla/jellyfin/cache:/cache
      - /home/narla/media:/media:ro
      - /home/narla/torrents:/torrents:ro
